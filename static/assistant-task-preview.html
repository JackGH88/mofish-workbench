<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 剪辑任务</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #f6f6f7; color: #1d1d1f; font: 14px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(420px, 100%); padding: 28px; border-radius: 22px; background: #fff; box-shadow: 0 12px 36px rgba(0,0,0,.06); }
    span { font-size: 12px; color: #86868b; letter-spacing: .04em; }
    h1 { margin: 8px 0 12px; font-size: 20px; line-height: 1.35; }
    p { margin: 0; color: #6e6e73; }
    small { display: block; margin-top: 18px; color: #a0a0a6; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <span>AI 剪辑 · WorkBuddy</span>
    <h1>剪辑任务已准备</h1>
    <p>指令已填入 WorkBuddy 输入框。请在 WorkBuddy 中确认后发送；分镜和预览确认后再导出回传。</p>
    <small>此页仅用于任务侧栏预览，不包含脚本或任务数据。</small>
  </main>
</body>
</html>
